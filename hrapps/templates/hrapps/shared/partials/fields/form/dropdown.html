<div class="form-field">
    <label for="question_{{ id }}" class="h5 {% if field.required %}required-field{% endif %}">{{ field.question }}</label>
    <select class="form-select" id="question_{{ id }}" {% if field.required %} required {% endif %}>
        {% for option in field.options %}
            <option value="{{ option }}">{{ option }}</option>
        {% endfor %}
    </select>
</div>
